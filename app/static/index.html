<!DOCTYPE html>
<html>
<head>
    <title>Password Analyzer</title>
</head>
<body>
    <h2>Password Security Analyzer</h2>

    <input id="pw" type="text" placeholder="Enter a password">
    <button onclick="requestAnalysis('/analyze')">Rule Check</button>
    <button onclick="requestAnalysis('/predict')">ML Prediction</button>

    <h3>Result</h3>
    <pre id="result"></pre>

    <script>
        async function requestAnalysis(path) {
            const pw = document.getElementById("pw").value;
            const result = document.getElementById("result");

            try {
                const res = await fetch(path, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password: pw })
                });

                const text = await res.text();
                try {
                    const data = JSON.parse(text);
                    result.innerText = JSON.stringify(data, null, 2);
                } catch {
                    result.innerText = text;
                }
            } catch (error) {
                result.innerText = "Request failed: " + error;
            }
        }
    </script>
</body>
</html>
