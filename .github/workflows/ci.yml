name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-train-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Train model and record MLflow run
        run: python scripts/train_model.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: password-strength-model
          path: |
            models/password_strength_model.joblib
            models/password_strength_model.metadata.json

      - name: Build Docker image
        run: docker build -t password-security-analyzer:ci .
